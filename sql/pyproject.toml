[project]
name = "sql-connector"
version = "0.1.0"
description = "The SQL connector: saved database connections and the read-only tools a local model uses to answer from them."
requires-python = ">=3.11"
dependencies = [
    # SQLite needs nothing: it is part of Python. Each driver is imported only
    # when a connection of its kind is used, so a missing one never stops the app.
    "psycopg[binary]>=3.2",  # PostgreSQL
    "pymysql>=1.1",          # MySQL and MariaDB
    "openpyxl>=3.1",         # attached Excel files, loaded into SQLite tables (sheets.py)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sql_connector"]
