[project]
name = "document-engine"
version = "0.1.0"
description = "The Word-documents feature: fills, changes and writes .docx files, with a local model deciding what goes where."
requires-python = ">=3.11"
dependencies = [
    "ollama-pipeline",
    "python-docx>=1.1",
    # The invoices tab: PDF pages as pictures, photos, and the Excel file.
    "pypdfium2>=4.30",
    "pillow>=10.0",
    "openpyxl>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["document_engine"]

[tool.uv.sources]
ollama-pipeline = { path = "../ollama", editable = true }
