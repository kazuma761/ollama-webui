[project]
name = "fastshot-backend"
version = "0.1.0"
description = "HTTP API for the Fastshot chat frontend, backed by the Ollama pipeline."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-dotenv>=1.0",
    "ollama-pipeline",
]

[tool.uv]
package = false

[tool.uv.sources]
ollama-pipeline = { path = "../ollama", editable = true }
