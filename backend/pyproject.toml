[project]
name = "fastshot-backend"
version = "0.1.0"
description = "HTTP API for the Fastshot chat frontend, backed by the Ollama pipeline."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "ollama-pipeline",
    "document-engine",
]

[project.optional-dependencies]
router = ["ollama-pipeline[router]"]

[tool.uv]
package = false

[tool.uv.sources]
ollama-pipeline = { path = "../ollama", editable = true }
document-engine = { path = "../documents", editable = true }
