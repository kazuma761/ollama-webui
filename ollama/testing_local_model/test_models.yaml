# Models and routes for the routing test (run_routing_test.py) - local models only.
# Same format as ollama/config/models.yaml, but nothing here is used by the app.
# Edit the `model:` tags to whatever is pulled on the machine you test on, and add or
# rename routes freely: the test reads them from here, and questions.yaml says which
# route each question should land on.
#
# No OpenCode / cloud routes on purpose (no code_route / expert_route below).

hosts:
  local: http://127.0.0.1:11434
default_host: local
discover: false

router:
  enabled: true
  backend: von
  device: cpu
  min_confidence: 0.7
  instructions: Which kind of assistant should answer this request?
  default_route: simple
  heavy_route: complex
  routes:
    simple:
      model: general
      description: >-
        Everyday writing and quick questions: emails, messages, replies,
        rewording, translation, short summaries, simple facts, small talk.
    complex:
      model: reasoning
      description: >-
        Work that needs careful thinking: analysing or reviewing documents,
        contracts, reports and data, logic and maths problems, comparing
        options, multi-step reasoning.
    coding:
      model: coder
      description: >-
        Anything about software and programming: writing, fixing, explaining or
        reviewing code, scripts, queries and configuration, error messages,
        tools, APIs, databases.
  image_model: vision

models:
  - id: general
    label: Llama 3.2
    model: llama3.2:3b
  - id: reasoning
    label: Qwen Fast
    model: qwen-fast:latest
  - id: coder
    label: Qwen Fast Code
    model: qwen-fast:latest
  - id: vision
    label: MiniCPM-V
    model: minicpm-v:latest
    vision: true
