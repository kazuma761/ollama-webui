# Ollama servers the platform can talk to.
# Today this is just your laptop; when you move to the company server add it
# here (or override a URL with the env var OLLAMA_HOST_<NAME>, e.g.
# OLLAMA_HOST_GPU=http://10.0.0.12:11434). OLLAMA_HOST overrides default_host.
hosts:
  local: http://127.0.0.1:11434
  # gpu: http://gpu-box.internal:11434

default_host: local

# true = every chat model pulled on a host also shows up in the picker,
# even if it has no entry below.
discover: true

# Options sent to Ollama for every model unless a model overrides them.
# num_ctx is how many tokens the model reads. Ollama's own default is small
# (often 4096), which silently cuts off attached documents - a 10-page PDF
# is roughly 6,000-8,000 tokens. Larger values use more memory; lower this
# if models start running slowly because they no longer fit on the GPU.
default_options:
  num_ctx: 16384

# Auto-routing: with "Auto" selected in the picker, each message is sent to
# the model whose route fits it best.
#   backend: von    a small decision model (https://github.com/wfzyx/von).
#                   Needs `cd backend && uv sync --extra router` once
#                   (Python 3.12+, ~3 GB of weights on first start).
#                   English only. Falls back to rules when missing or unsure.
#   backend: rules  keyword rules only, nothing to install.
router:
  enabled: true
  backend: von
  device: cpu            # keeps the GPU free for the answering models
  min_confidence: 0.7    # below this, Von's answer is not trusted
  instructions: Which kind of assistant should answer this request?
  default_route: simple  # light model
  heavy_route: complex   # strongest local model
  expert_route: expert   # cloud; remove this line and the route below to stay fully local
  image_model: vision    # messages with screenshots go straight here
  routes:
    simple:
      model: general
      description: >-
        Everyday writing and quick questions: emails, messages, replies,
        rewording, translation, short summaries, simple facts, small talk.
    complex:
      model: reasoning
      description: >-
        Work that needs careful thinking: writing or debugging code, logic
        and maths problems, multi-step reasoning, technical design, analysing
        or reviewing documents and data.
    expert:
      model: opencode
      description: >-
        The hardest software engineering questions: designing a system or its
        architecture, scaling and trade-off decisions, large refactors and
        migrations, and bugs that are hard to find such as race conditions,
        deadlocks, memory leaks or failures that only happen sometimes.

# OpenCode (https://github.com/anomalyco/opencode) answers the "expert" route
# with its free cloud models. Needs the `opencode` command installed; nothing
# else to configure. IMPORTANT: messages sent to this route leave this machine.
# Attached documents and images are never sent - those stay on local models.
# If OpenCode is missing, offline or refuses, the local heavy model answers.
opencode:
  command: opencode
  agent: plan      # keep a built-in agent: the free tier refuses custom ones
  timeout: 300     # seconds before giving up and answering locally

# Picked when the user has not chosen a model yet (and Auto is off). Falls back to the first
# available model if this one is not pulled.
default_model: general

# Named models shown in the picker. Each one maps a friendly label to an
# Ollama model tag on a host, plus an optional system prompt and options.
# Several entries may point at the same tag with different prompts.
models:
  - id: general
    label: Llama 3.2
    model: llama3.2:3b
    host: local
    description: Fast general-purpose assistant
    system: |
      You are an internal assistant for our engineering team. Be direct and
      concise. Use Markdown, and fenced code blocks for any code.
    options:
      temperature: 0.7

  - id: reasoning
    label: Qwen 3 14B
    model: qwen3:14b
    host: local
    description: Reasoning, code and document analysis
    system: |
      You are a careful senior engineer and analyst. Work through the problem
      step by step, then give a clear final answer. Use fenced code blocks
      with a language tag for any code. When documents are attached, base
      your answer on their content and say so if something is not in them.
    options:
      temperature: 0.3

  - id: opencode
    label: OpenCode Big Pickle
    provider: opencode
    model: opencode/big-pickle   # any id from `opencode models`
    description: Cloud (free tier) - architecture, hard debugging, complex code

  - id: coder
    label: Qwen Coder
    model: qwen2.5-coder:7b
    host: local
    description: Code generation and review
    system: |
      You are a senior software engineer. Answer with working code first,
      then a short explanation. Use fenced code blocks with a language tag.
    options:
      temperature: 0.2

  - id: vision
    label: Gemma 3 Vision
    model: gemma3:4b
    host: local
    description: Reads screenshots and images
    vision: true
    system: |
      You are a product engineer. When given a screenshot, describe the UI
      precisely before answering the question.
