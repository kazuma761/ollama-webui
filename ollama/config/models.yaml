# ==========================================================================
# THE ONE FILE FOR MODELS. Nothing else in the project names a model.
#
# To use the Ollama models of this machine, go to `models:` below and change
# the `model:` tag (and the `label:` shown in the picker) of these entries:
#     id: general     the light model - mail, quick questions
#     id: reasoning   the strongest local model - hard questions, documents
#     id: vision      reads screenshots
# then restart the app. `ollama list` shows the tags you have. Leave the ids
# as they are: the routes under `router:` refer to them.
# Any other model you have pulled shows up in the picker on its own
# (`discover: true`). It needs an entry here only to get a label or a system
# prompt, or to be used by Auto.
# Check the result:  cd backend && uv run --inexact python -m ollama_pipeline
#
# A copy of this folder named ollama/config.local/ (not in git) replaces it on
# a machine that has one. The check above prints which folder is in use.
# ==========================================================================

# Ollama servers the platform can talk to.
# Today this is just your laptop; when you move to the company server add it
# here (or override a URL with the env var OLLAMA_HOST_<NAME>, e.g.
# OLLAMA_HOST_GPU=http://10.0.0.12:11434). OLLAMA_HOST overrides default_host.
hosts:
  local: http://127.0.0.1:11434
  # gpu: http://gpu-box.internal:11434

default_host: local

# true = every chat model pulled on a host also shows up in the picker,
# even if it has no entry below.
discover: true

# Options sent to Ollama for every model unless a model overrides them.
# num_ctx is how many tokens the model reads. Ollama's own default is small
# (often 4096), which silently cuts off attached documents - a 10-page PDF
# is roughly 6,000-8,000 tokens. Larger values use more memory; lower this
# if models start running slowly because they no longer fit on the GPU.
default_options:
  num_ctx: 16384

# Auto-routing: with "Auto" selected in the picker, each message is sent to
# the model whose route fits it best.
#   backend: von    a small decision model (https://github.com/wfzyx/von).
#                   Needs `cd backend && uv sync --extra router` once
#                   (Python 3.12+, ~3 GB of weights on first start).
#                   English only. Falls back to rules when missing or unsure.
#   backend: rules  keyword rules only, nothing to install.
router:
  enabled: true
  backend: von
  device: cpu            # keeps the GPU free for the answering models
  min_confidence: 0.7    # below this, Von's answer is not trusted
  instructions: Which kind of assistant should answer this request?
  default_route: simple  # light model
  heavy_route: complex   # strongest local model
  # The next two routes are answered in the cloud. To stay fully local remove these
  # two lines and both routes. Von chooses between the local routes only; whether a
  # request is about software is decided in router.py (keywords, then two questions
  # to Von), so the two descriptions below are for the reader.
  code_route: code       # questions about software
  expert_route: expert   # the hardest of those
  image_model: vision    # messages with screenshots go straight here
  routes:
    simple:
      model: general
      description: >-
        Everyday writing and quick questions: emails, messages, replies,
        rewording, translation, short summaries, simple facts, small talk.
    complex:
      model: reasoning
      description: >-
        Work that needs careful thinking: analysing or reviewing documents,
        contracts, reports and data, logic and maths problems, comparing
        options, multi-step reasoning, code and technical questions.
    code:
      # A list is tried in order: the first model that answers is used.
      model: [opencode-space-bunny, opencode, opencode-mimo, opencode-nemotron-lightning]
      description: >-
        Anything about software and programming: writing, fixing, explaining or
        reviewing code, scripts, queries and configuration, error messages,
        tools, APIs, databases and system design.
    expert:
      model: [opencode, opencode-nemotron-ultra, opencode-space-bunny]
      # A software question comes here when it also has the expert keywords in router.py.
      description: >-
        The hardest software engineering questions: designing a system or its
        architecture, scaling and trade-off decisions, large refactors and
        migrations, and bugs that are hard to find such as race conditions,
        deadlocks, memory leaks or failures that only happen sometimes.

# OpenCode (https://github.com/anomalyco/opencode) answers the "code" and
# "expert" routes with its free cloud models. Needs OpenCode 1.x
# (`npm i -g opencode-ai@1`); 2.x has a different server and does not work.
# IMPORTANT: messages sent to these routes leave this machine.
# Attached documents and images are never sent - those stay on local models.
# If a model does not answer, the next one in its route is tried, then the
# local heavy model. The same happens when OpenCode is missing or offline.
opencode:
  command: opencode   # version 1.18.34; a full path to the program also works
  agent: plan      # keep a built-in agent: the free tier refuses custom ones
  timeout: 120     # seconds without any progress before answering locally instead
  # home: /some/folder   # where the app's OpenCode keeps its own data; default is ollama/.opencode

# The Word-documents page (documents.html): fill a template, change a document,
# write a new one. Only local models are used here - files never go to the cloud.
# The model decides what goes where; the app's own code writes the Word file.
documents:
  # model: reasoning   # id of a local model below; default is the heavy route's model.
                       # A larger model matches information to blanks more reliably.
  max_jobs: 2          # document jobs asking the model at once; others wait their turn
  second_check: false  # true = ask the model again about values it did not copy from
                       # your files or instructions (slower; shown as "could not confirm")
  keep_hours: 24       # uploaded and generated files are deleted from the server after this
  allow_cloud: false   # true lets OpenCode's cloud models work on documents. For trying the
                       # page on a machine without Ollama only - documents then leave this machine.

# Picked when the user has not chosen a model yet (and Auto is off). Falls back to the first
# available model if this one is not pulled.
default_model: general

# Named models shown in the picker. Each one maps a friendly label to an
# Ollama model tag on a host, plus an optional system prompt and options.
# Several entries may point at the same tag with different prompts.
models:
  # ---- Local models (Ollama): change `model:` and `label:` to what this machine has ----
  - id: general
    label: Llama 3.2
    model: llama3.2:3b
    host: local
    description: Fast general-purpose assistant
    system: |
      You are an internal assistant for our engineering team. Be direct and
      concise. Use Markdown, and fenced code blocks for any code.
    options:
      temperature: 0.7

  - id: reasoning
    label: Qwen 3 14B
    model: qwen3:14b
    host: local
    description: Reasoning, code and document analysis
    system: |
      You are a careful senior engineer and analyst. Work through the problem
      step by step, then give a clear final answer. Use fenced code blocks
      with a language tag for any code. When documents are attached, base
      your answer on their content and say so if something is not in them.
    options:
      temperature: 0.3

  - id: coder
    label: Qwen Coder
    model: qwen2.5-coder:7b
    host: local
    description: Code generation and review
    system: |
      You are a senior software engineer. Answer with working code first,
      then a short explanation. Use fenced code blocks with a language tag.
    options:
      temperature: 0.2

  - id: vision
    label: Gemma 3 Vision
    model: gemma3:4b
    host: local
    description: Reads screenshots and images
    vision: true
    system: |
      You are a product engineer. When given a screenshot, describe the UI
      precisely before answering the question.

  # ---- Cloud models (OpenCode) ----
  # OpenCode's free cloud models; `model` is an id from `opencode models`. The
  # free list changes: an id OpenCode stops offering shows as unavailable and is
  # skipped. Tested 2026-10-04 with a coding task and a bug hunt; all of these
  # answered correctly. Left out: longcat-2.5-preview-free (a preview) and
  # ling-3.0-flash-fin-free ("Endpoint is unavailable").
  # What each provider does with prompts, from https://opencode.ai/docs/zen on
  # that date: Space Bunny keeps nothing; Big Pickle, MiMo, Ling and Fledge
  # "may be used to improve the model"; Nemotron is logged; Muse Spark trains
  # future Meta models, which is why it is in no route.
  - id: opencode
    label: OpenCode Big Pickle
    provider: opencode
    model: opencode/big-pickle
    description: Cloud (free) - architecture, hard debugging, complex code

  - id: opencode-space-bunny
    label: OpenCode Space Bunny
    provider: opencode
    model: opencode/space-bunny-free
    description: Cloud (free) - coding, fastest in testing, keeps no data

  - id: opencode-nemotron-ultra
    label: OpenCode Nemotron 3 Ultra
    provider: opencode
    model: opencode/nemotron-3-ultra-free
    description: Cloud (free) - coding and hard problems

  - id: opencode-mimo
    label: OpenCode MiMo V2.6 Flash
    provider: opencode
    model: opencode/mimo-v2.6-flash-free
    description: Cloud (free) - coding

  - id: opencode-nemotron-lightning
    label: OpenCode Nemotron 3.5 Lightning
    provider: opencode
    model: opencode/nemotron-3.5-lightning-free
    description: Cloud (free) - coding

  - id: opencode-ling
    label: OpenCode Ling 3.1 Flash
    provider: opencode
    model: opencode/ling-3.1-flash-free
    description: Cloud (free) - coding, slowest in testing

  - id: opencode-fledge
    label: OpenCode Fledge Alpha
    provider: opencode
    model: opencode/fledge-alpha-free
    description: Cloud (free) - coding, an alpha model

  - id: opencode-muse-spark
    label: OpenCode Muse Spark 1.3
    provider: opencode
    model: opencode/muse-spark-1.3-contributor-free
    description: Cloud (free) - coding, prompts are used to train Meta models
