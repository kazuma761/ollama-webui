[project]
name = "ollama-pipeline"
version = "0.1.0"
description = "Ollama integration layer: hosts, model registry and the chat pipeline."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ollama_pipeline"]
