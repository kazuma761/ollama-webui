[project]
name = "agent-skills"
version = "0.1.0"
description = "Agent skills the chat's local model can use - charts and memory - and the switches an admin turns them on and off with."
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_skills"]
